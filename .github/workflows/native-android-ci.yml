name: Native Android app checks and APK

on:
  push:
    branches: [feat/native-expo-android]
    paths:
      - "android-app/**"
      - ".github/workflows/native-android-ci.yml"
  pull_request:
    paths:
      - "android-app/**"
      - ".github/workflows/native-android-ci.yml"
  workflow_dispatch:

concurrency:
  group: monetra-native-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: android-app/package.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure preinstalled Android SDK
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Ensure this is a standalone app (no Expo development client)
        run: |
          if npm ls expo-dev-client --depth=0; then
            echo "expo-dev-client must not be installed in the standalone APK."
            exit 1
          fi

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Assemble standalone release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Verify standalone APK output
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "package: name='com.flickscient.monetramobile'"
          if "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -qi "launchable-activity"; then
            echo "Standalone APK contains a launchable Android activity."
          else
            echo "APK has no launchable activity."
            exit 1
          fi

      - name: Upload standalone Monetra APK
        uses: actions/upload-artifact@v4
        with:
          name: monetra-standalone-android-apk
          path: android-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
