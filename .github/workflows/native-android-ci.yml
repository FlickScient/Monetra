name: Native Android app checks

on:
  push:
    branches: [feat/native-expo-android]
    paths:
      - "android-app/**"
      - ".github/workflows/native-android-ci.yml"
  pull_request:
    paths:
      - "android-app/**"
      - ".github/workflows/native-android-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: android-app/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Expo config and native dependency check
        run: npx expo-doctor
      - name: Bundle Android app
        run: npx expo export --platform android
