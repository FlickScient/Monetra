name: Refresh npm lockfile

on:
  push:
    branches: [feat/android-local-first]
    paths:
      - package.json
      - package-lock.json

permissions:
  contents: write

concurrency:
  group: monetra-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve and write exact dependency lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh lockfile for native Android dependencies"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
