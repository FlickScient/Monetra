name: Monetra CI

on:
  push:
    branches: [main, ui/monetra-foundation]
  pull_request:

concurrency:
  group: monetra-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify database scripts syntax
        run: |
          node --check scripts/verify-workspace-migration.mjs
          node --check scripts/preflight-workspace-migration.mjs
          node --check scripts/ensure-workspace-migrations.mjs
          node --check scripts/diagnose-database.mjs
      - name: TypeScript check
        run: npm run typecheck
