name: Monetra CI

on:
  push:
    branches: [main, ui/monetra-foundation]
  pull_request:

concurrency:
  group: monetra-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify database scripts syntax
        run: |
          node --check scripts/verify-workspace-migration.mjs
          node --check scripts/preflight-workspace-migration.mjs
          node --check scripts/ensure-workspace-migrations.mjs
          node --check scripts/diagnose-database.mjs
          node --check scripts/preflight-finance-sync-migration.mjs
          node --check scripts/verify-finance-sync-migration.mjs
      - name: Validate Android SQLite schema
        run: python3 scripts/verify-android-sqlite-schema.py
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build
        env:
          MONETRA_CI_BUILD: '1'
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_bW9uZXRyYS1jaS5jbGVyay5hY2NvdW50cy5kZXYk
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
