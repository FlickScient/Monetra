name: Monetra Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - "feat/unified-monetra-android"
    paths:
      - "native-app/**"
      - "app/**"
      - "components/monetra/**"
      - "lib/native-api-fetch.ts"
      - "lib/offline/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "scripts/configure-android-sso.mjs"
      - "android/database/**"
      - "public/sqlite/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "native-app/**"
      - "app/**"
      - "components/monetra/**"
      - "lib/native-api-fetch.ts"
      - "lib/offline/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "scripts/configure-android-sso.mjs"
      - "android/database/**"
      - "public/sqlite/**"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: monetra-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android compile SDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Install dependencies
        run: npm ci
      - name: Fetch canonical Monetra app icon
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/FlickScient/Monetra/3ccd32ebffce003858a3263ea7bb39e5ac22a8ed/public/icon.png \
            --output public/icon.png
          file public/icon.png
      - name: Type-check standalone native app
        run: npx tsc --noEmit -p native-app/tsconfig.json
      - name: Validate native app runtime configuration
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$VITE_CLERK_PUBLISHABLE_KEY" || (echo "Missing VITE_CLERK_PUBLISHABLE_KEY secret" && exit 1)
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || (echo "Missing VITE_SUPABASE_PUBLISHABLE_KEY secret" && exit 1)
      - name: Build standalone native app bundle
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_MONETRA_API_URL: https://monetra-4rax.vercel.app
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build:native
      - name: Generate Android project and sync plugins
        run: |
          npx cap add android
          npx cap sync android
          node scripts/configure-android-sso.mjs
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick
          mkdir -p android-native/app/src/main/res/drawable-nodpi
          rm -f android-native/app/src/main/res/drawable/ic_monetra_foreground.xml
          for spec in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $spec
            density="$1"
            pixels="$2"
            target="android-native/app/src/main/res/mipmap-$density"
            mkdir -p "$target"
            convert public/icon.png -resize "${pixels}x${pixels}" "$target/ic_launcher.png"
            cp "$target/ic_launcher.png" "$target/ic_launcher_round.png"
          done
          # Android adaptive icons use the official artwork in the foreground safe zone.
          convert public/icon.png -resize 288x288 -gravity center -background none -extent 432x432 \
            android-native/app/src/main/res/drawable-nodpi/ic_monetra_foreground.png
          # Use the smaller Gradle binary distribution and allow slow CI downloads.
          sed -i 's/gradle-8.14.3-all.zip/gradle-8.14.3-bin.zip/' android-native/gradle/wrapper/gradle-wrapper.properties
          echo 'networkTimeout=120000' >> android-native/gradle/wrapper/gradle-wrapper.properties
      - name: Assemble debug APK
        run: |
          cd android-native
          ./gradlew --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: monetra-android-debug
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
