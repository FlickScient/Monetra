name: Monetra backup database migration

on:
  workflow_dispatch:
    inputs:
      confirm_backup_target:
        description: "Type APPLY_TO_BACKUP only after confirming MONETRA_BACKUP_DATABASE_URL points to monetra-before-workspace-migration."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: monetra-backup-migration
  cancel-in-progress: false

jobs:
  migrate-and-verify:
    if: github.event.inputs.confirm_backup_target == 'APPLY_TO_BACKUP'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Preflight backup schema (read-only)
        env:
          DATABASE_URL: ${{ secrets.MONETRA_BACKUP_DATABASE_URL }}
        run: node scripts/preflight-workspace-migration.mjs

      - name: Apply reviewed Drizzle migrations to backup branch
        env:
          DATABASE_URL: ${{ secrets.MONETRA_BACKUP_DATABASE_URL }}
        run: npm run db:migrate

      - name: Verify complete workspace migration
        env:
          DATABASE_URL: ${{ secrets.MONETRA_BACKUP_DATABASE_URL }}
        run: node scripts/verify-workspace-migration.mjs
